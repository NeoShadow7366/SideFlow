<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self';"
    />
    <title>SideFlow Edge Handle</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-user-select: none;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
      }
      .edge-wrap {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: flex-start;
        padding-top: 26vh;
        pointer-events: none;
      }
      .edge-wrap.edge-right {
        justify-content: flex-end;
      }
      .edge-wrap.edge-left {
        justify-content: flex-start;
      }
      .edge-btn {
        pointer-events: auto;
        appearance: none;
        border: 1px solid rgba(199, 210, 254, 0.45);
        background: rgba(79, 70, 229, 0.72);
        color: #ffffff;
        padding: 20px 4px;
        opacity: 0.45;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        box-shadow:
          0 0 0 1px rgba(15, 23, 42, 0.65),
          0 6px 14px -3px rgba(0, 0, 0, 0.4);
        transition:
          padding 0.2s ease,
          background-color 0.2s ease,
          opacity 0.2s ease,
          transform 0.2s ease;
        outline: none;
      }
      .edge-wrap.edge-right .edge-btn {
        border-right: none;
        border-radius: 10px 0 0 10px;
      }
      .edge-wrap.edge-left .edge-btn {
        border-left: none;
        border-radius: 0 10px 10px 0;
      }
      .edge-btn:hover {
        opacity: 1;
        padding-left: 10px;
        padding-right: 10px;
        background: rgb(99, 102, 241);
      }
      .edge-btn:active {
        background: rgb(67, 56, 202);
      }
      .edge-btn:focus-visible {
        opacity: 1;
        padding-left: 10px;
        padding-right: 10px;
        background: rgb(99, 102, 241);
        box-shadow:
          inset 0 0 0 2px #ffffff,
          0 0 0 1px rgba(15, 23, 42, 0.9),
          0 10px 15px -3px rgba(0, 0, 0, 0.45);
      }
      .edge-btn.dictating {
        opacity: 0.95;
        padding-left: 7px;
        padding-right: 7px;
        background: rgba(225, 29, 72, 0.92);
        border-color: rgba(253, 164, 175, 0.7);
      }
      .edge-btn.dictating:hover {
        opacity: 1;
        background: rgb(244, 63, 94);
      }
      .edge-btn.dictating:active {
        background: rgb(190, 18, 60);
      }
      .chevron {
        width: 14px;
        height: 14px;
        transition: transform 0.2s ease;
      }
      .edge-wrap.edge-right .edge-btn:hover .chevron {
        transform: translateX(-2px);
      }
      .edge-wrap.edge-left .edge-btn:hover .chevron {
        transform: translateX(2px);
      }
      .mic-wrap {
        position: relative;
        display: none;
        width: 10px;
        height: 10px;
        align-items: center;
        justify-content: center;
      }
      .edge-btn.dictating .mic-wrap {
        display: flex;
      }
      .ping {
        position: absolute;
        inset: 0;
        border-radius: 9999px;
        background: #ffffff;
        opacity: 0.75;
        animation: ping 1.2s cubic-bezier(0, 0, 0.2, 1) infinite;
      }
      .mic-icon {
        position: relative;
        width: 10px;
        height: 10px;
      }
      @keyframes ping {
        75%,
        100% {
          transform: scale(2);
          opacity: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .edge-btn,
        .chevron {
          transition: none;
        }
        .ping {
          animation: none;
          opacity: 0.35;
        }
      }
    </style>
  </head>
  <body>
    <div id="wrap" class="edge-wrap edge-right">
      <button
        id="companion-edge-tab"
        type="button"
        class="edge-btn"
        aria-label="Open SideFlow Panel"
        title="Open SideFlow Panel (Alt + Space)"
      >
        <span class="mic-wrap" aria-hidden="true">
          <span class="ping"></span>
          <svg
            class="mic-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.4"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z" />
            <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
            <line x1="12" x2="12" y1="19" y2="22" />
          </svg>
        </span>
        <svg
          id="chevron-icon"
          class="chevron"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path id="chevron-path" d="m15 18-6-6 6-6" />
        </svg>
      </button>
    </div>
    <script src="./edge-tab.js"></script>
  </body>
</html>
