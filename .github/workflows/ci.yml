name: CI — Typecheck, Test & Build

on:
  push:
    branches:
      - master
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, Vitest & Production Build
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck Renderer & Electron Targets
        run: |
          npx tsc -b --noEmit
          npx tsc -p tsconfig.electron.json --noEmit

      - name: Run Automated Test Suite
        run: npm test

      - name: Verify Production Build
        run: npm run build
