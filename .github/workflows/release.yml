name: Build & Publish SideFlow Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Version bump before building (or "current" to release existing version in package.json)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
          - current

permissions:
  contents: write
  attestations: write
  id-token: write

jobs:
  release-windows:
    name: Build, Scan & Publish Windows Installer (NSIS + Auto-Update Metadata)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck & Run Automated Test Suite
        run: |
          npx tsc -b --noEmit
          npx tsc -p tsconfig.electron.json --noEmit
          npm test

      - name: Bump Version & Push Tag (when triggered via workflow_dispatch)
        id: version_step
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          if ($env:EVENT_NAME -eq "workflow_dispatch" -and $env:RELEASE_TYPE -ne "current") {
            if ($env:RELEASE_TYPE -notin @("patch", "minor", "major")) {
              throw "Invalid release_type: $env:RELEASE_TYPE"
            }
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            npm version $env:RELEASE_TYPE -m "chore(release): v%s"
            git push origin HEAD --follow-tags
          }
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $ver = $pkg.version
          $tag = "v$ver"
          Write-Output "Releasing SideFlow $tag"
          "VERSION=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "TAG=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build Renderer & Electron Bundles
        run: npm run build

      - name: Package Windows NSIS & Portable Artifacts Locally (Before Malware Scan)
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: npx electron-builder --win nsis portable --publish never

      - name: Gate Release on Windows Defender Scan, Checksums & Ed25519 Manifest Signature
        id: checksums_step
        shell: pwsh
        env:
          UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY }}
        run: |
          $defenderExe = "$env:ProgramFiles\Windows Defender\MpCmdRun.exe"
          if (Test-Path $defenderExe) {
            Write-Host "Running Windows Defender Antivirus scan on release binaries..."
            & $defenderExe -Scan -ScanType 3 -File "$PWD\release"
            if ($LASTEXITCODE -ne 0) {
              throw "Windows Defender scan failed with exit code $LASTEXITCODE. Aborting release publication."
            }
          } else {
            throw "Windows Defender MpCmdRun.exe not found on runner."
          }

          $exeFiles = Get-ChildItem -Path "release" -Filter "*.exe" -File -ErrorAction Stop
          if (-not $exeFiles -or $exeFiles.Count -eq 0) {
            throw "No built .exe artifacts found in release/."
          }

          $lines = @()
          foreach ($f in $exeFiles) {
            $hash = (Get-FileHash -Path $f.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $lines += "$hash  $($f.Name)"
          }
          if (Test-Path "install.ps1") {
            $psHash = (Get-FileHash -Path "install.ps1" -Algorithm SHA256).Hash.ToLowerInvariant()
            $lines += "$psHash  install.ps1"
          }
          $sumsPath = Join-Path "release" "SHA256SUMS.txt"
          $lines | Set-Content -Path $sumsPath -Encoding UTF8
          Get-Content $sumsPath | Write-Host

          $latestYml = Join-Path "release" "latest.yml"
          if ($env:UPDATE_SIGNING_PRIVATE_KEY -and (Test-Path $latestYml)) {
            Write-Host "Signing release/latest.yml with Ed25519 private key..."
            node scripts/generate-update-keys.mjs --sign $latestYml
          }

      - name: Attest Build Provenance (SLSA Cryptographic Attestation)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'release/*.exe'

      - name: Create Draft Release, Upload Verified Assets & Publish Atomically
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "${{ steps.version_step.outputs.TAG }}"
          $ver = "${{ steps.version_step.outputs.VERSION }}"

          $sumsPath = Join-Path "release" "SHA256SUMS.txt"
          $sumsContent = (Get-Content -Path $sumsPath -Raw).Trim()

          $notes = @"
          ### ⚡ Warning-Free 1-Line Windows Install / Upgrade (No SmartScreen or UAC Prompts)
          Run in PowerShell:
          ``````powershell
          irm https://raw.githubusercontent.com/NeoShadow7366/SideFlow/master/install.ps1 | iex
          ``````
          *Strictly verifies the SHA-512 checksum against ``latest.yml`` (failing closed on mismatch), removes the browser Mark-of-the-Web (``Zone.Identifier``) stream, and installs silently per-user.*

          ### 🔒 Supply-Chain & Cryptographic Verification
          - **Windows Defender Antivirus Scan**: Passed (``0`` threats detected prior to publication)
          - **Verify GitHub Build Provenance Attestation**:
            ``````powershell
            gh attestation verify "SideFlow-Setup-$ver.exe" --repo NeoShadow7366/SideFlow
            ``````
          - **SHA-256 Checksums (``SHA256SUMS.txt``)**:
            ``````text
          $sumsContent
            ``````
          "@

          $existingRelease = gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --draft --title "SideFlow $tag" --notes $notes
            if ($LASTEXITCODE -ne 0) { throw "Failed to create draft GitHub release $tag" }
          } else {
            gh release edit $tag --draft --notes $notes
            if ($LASTEXITCODE -ne 0) { throw "Failed to update draft GitHub release $tag" }
          }

          $uploadAssets = @()
          $uploadAssets += (Get-ChildItem -Path "release" -File | Where-Object {
            $_.Extension -in @('.exe', '.blockmap', '.yml', '.sig', '.txt')
          } | ForEach-Object { $_.FullName })
          if (Test-Path "install.ps1") {
            $uploadAssets += "install.ps1"
          }

          gh release upload $tag @uploadAssets --clobber
          if ($LASTEXITCODE -ne 0) { throw "Failed to upload release assets for $tag" }

          gh release edit $tag --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw "Failed to publish GitHub release $tag" }
