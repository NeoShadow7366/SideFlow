name: Build & Publish SideFlow Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Version bump before building (or "current" to release existing version in package.json)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
          - current

permissions:
  contents: write

jobs:
  release-windows:
    name: Build & Publish Windows Installer (NSIS + Auto-Update Metadata)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Automated Test Suite
        run: npm test

      - name: Bump Version & Push Tag (when triggered via workflow_dispatch)
        id: version_step
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          if ($env:EVENT_NAME -eq "workflow_dispatch" -and $env:RELEASE_TYPE -ne "current") {
            if ($env:RELEASE_TYPE -notin @("patch", "minor", "major")) {
              throw "Invalid release_type: $env:RELEASE_TYPE"
            }
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            npm version $env:RELEASE_TYPE -m "chore(release): v%s"
            git push origin HEAD --follow-tags
          }
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $ver = $pkg.version
          $tag = "v$ver"
          Write-Output "Releasing SideFlow $tag"
          "VERSION=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "TAG=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build Renderer & Electron Bundles
        run: npm run build

      - name: Package & Publish NSIS Installer + Auto-Update Artifacts to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: npx electron-builder --win nsis portable --publish always

      - name: Upload Warning-Free PowerShell Installer & Finalize GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ steps.version_step.outputs.TAG }}"
          try {
            if (Test-Path "install.ps1") {
              gh release upload $tag "install.ps1" --clobber
            }
            $notes = @"
          ### ⚡ Warning-Free 1-Line Windows Install / Upgrade (No SmartScreen or UAC Prompts)
          Run in PowerShell:
          ``````powershell
          irm https://raw.githubusercontent.com/NeoShadow7366/SideFlow/master/install.ps1 | iex
          ``````
          *Verifies the SHA-512 checksum against `latest.yml`, removes the browser Mark-of-the-Web (`Zone.Identifier`) stream, and installs silently per-user.*
          "@
            gh release edit $tag --draft=false --latest --notes $notes
          } catch {
            Write-Host "Release $tag already published or finalized: $($_.Exception.Message)"
          }
